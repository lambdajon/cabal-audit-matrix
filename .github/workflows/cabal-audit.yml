name: "Cabal audit"

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      ghcs: ${{ steps.ghcs.outputs.ghcs }}
    steps:
      # Need the repo checked out in order to read the file
      - uses: actions/checkout@v7
      - id: ghcs
        run: echo "ghcs=$(cat ./.github/workflows/supported-ghc-versions.json)" >> $GITHUB_OUTPUT

  cabal-audit:
    name: "Scan dependencies for vulnerabilities (GHC ${{ matrix.ghc }})"
    needs: pre_job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON(needs.pre_job.outputs.ghcs) }}
    steps:
      - uses: actions/checkout@v7

      # cabal-audit computes the build plan, so GHC and cabal must be on $PATH
      - uses: haskell-actions/setup@v2.11
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'
          enable-stack: false

      - run: cabal update

      - name: Download cabal-audit
        run: |
          wget https://github.com/MangoIV/cabal-audit/releases/download/nightly/cabal-audit -O "$RUNNER_TEMP/cabal-audit"
          chmod +x "$RUNNER_TEMP/cabal-audit"

      - name: Run cabal-audit
        run: |
          "$RUNNER_TEMP/cabal-audit" --sarif --to-file results.sarif
          cat results.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: cabal-audit-ghc-${{ matrix.ghc }}