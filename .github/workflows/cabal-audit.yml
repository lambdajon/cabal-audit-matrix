name: "Cabal audit"

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      ghcs: ${{ steps.ghcs.outputs.ghcs }}
    steps:
      # Need the repo checked out in order to read the file
      - uses: actions/checkout@v7
      - id: ghcs
        run: echo "ghcs=$(cat ./.github/workflows/supported-ghc-versions.json)" >> $GITHUB_OUTPUT

  cabal-audit:
    name: "Scan dependencies for vulnerabilities (GHC ${{ matrix.ghc }})"
    needs: pre_job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON(needs.pre_job.outputs.ghcs) }}
    steps:
      - uses: actions/checkout@v7

      # cabal-audit computes the build plan, so GHC and cabal must be on $PATH
      - uses: haskell-actions/setup@v2.11
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'
          enable-stack: false

      # Runs cabal-audit and uploads the SARIF report to GitHub code scanning
      - uses: blackheaven/haskell-security-action@df18e40481ae37a2a023308720b701063a98157b # v1.1.0